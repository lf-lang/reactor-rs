[package]
name = "reactor-rs"
version = "0.1.0"
authors = ["Clément Fournier <clement.fournier76@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
log = { version = "0.4", default-features = false }
index_vec = "0.1"
#itertools = "0.10.1"
#bit-set = "0.5"
smallvec = { version = "1.10", features = ["const_generics"] }
petgraph = { version = "0.8", default-features = false }
array-macro = "2.1"
atomic_refcell = "0.1"
crossbeam-utils = { version = "0.8", default-features = false }
static_assertions = "1.1.0"
cfg-if = "1.0.0"

# std backend
crossbeam-channel = { git = "https://github.com/oowekyala/crossbeam.git", rev = "9eed66904f969156dedad4eef61ce91d23b9cccb", optional = true }
rayon = { version = "1.5", optional = true }

# embassy (no_std) backend
hashbrown = { version = "0.17", optional = true, default-features = false, features = ["default-hasher"] }
embassy-time = { version = "0.5", optional = true }
embassy-sync = { version = "0.8", optional = true }
embassy-futures = { version = "0.1", optional = true }
portable-atomic = { version = "1", optional = true, default-features = false }
portable-atomic-util = { version = "0.2", optional = true, default-features = false, features = ["alloc"] }

[dev-dependencies]
criterion = "0.3"
env_logger = "0.9"
assert_matches = "1.5"
dmsort = "1.0.1"

[features]
default=["std", "vec-id-sets"]
# Run on an OS: std clock, OS threads for physical actions.
std=["dep:crossbeam-channel", "petgraph/std", "crossbeam-utils/std"]
# Run on a microcontroller with embassy (no_std + alloc).
# Use with `default-features = false`. If `std` is also on, std wins.
embassy=["dep:hashbrown", "dep:embassy-time", "dep:embassy-sync", "dep:embassy-futures"]
# For targets without compare-and-swap atomics (ARMv6-M, e.g. the RP2040).
# The binary must also enable one of portable-atomic's CAS backends,
# such as its `critical-section` feature.
portable-atomic=["dep:portable-atomic", "dep:portable-atomic-util", "atomic_refcell/portable-atomic"]
# Enable the parallel runtime implementation todo make default
parallel-runtime=["std", "dep:rayon"]
# Enables 64-bit wide reaction ids on 64 bit architectures.
# This may reduce performance, but allows for 2^32 reactor
# instances compared to the default of 2^16, which may feel
# a bit tight for some applications.
wide-ids=[]
vec-id-sets=[]
no-unsafe=[]
# used internally for benchmarking, to access private APIs
public-internals=[]

[[bench]]
name = "savina_pong"
harness = false

[[bench]]
name = "global_id"
path = "benches/micro/global_id.rs"
required-features = ["public-internals"]
harness = false

[[bench]]
name = "dmsort"
path = "benches/micro/dmsort.rs"
required-features = ["public-internals"]
harness = false

[[bench]]
name = "exec_reactions"
path = "benches/micro/exec_reactions.rs"
required-features = ["public-internals"]
harness = false
